name: BRKZ
description: BRKZ is a Saudi Arabian construction-technology company operating a B2B online
  marketplace for building materials and construction equipment. Positioned as a top online
  building materials store in the Kingdom of Saudi Arabia (KSA), the platform connects contractors
  and construction businesses with material suppliers, streamlining procurement and offering
  nationwide delivery across Saudi Arabia. The bilingual (Arabic and English) storefront lets
  buyers source construction supplies online, and the company is backed by 500 Global among
  its investors. This profile was enriched from BRKZ's public web presence; the company runs
  a private, authenticated API host (api.brkz.com) but does not publish a public developer
  program, SDKs, or API documentation.
